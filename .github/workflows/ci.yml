name: CI / CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  version-consistency:
    name: ARC Version Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Check package and Tauri versions
        run: node scripts/check-version-consistency.mjs

  test-chezcord:
    name: Test Chezcord lib (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Chezcord Unit & Integration Tests
        run: npm run test:chezcord

  test-studio-server:
    name: Test Studio Server (Node 22.x)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Studio Server Tests
        run: npm run test:server

  build-client:
    name: Build Studio Client
    runs-on: ubuntu-24.04
    needs: [test-chezcord, test-studio-server]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Vite Frontend Bundle
        run: npm run build:client

  server-diagnostics:
    name: Server Pre-flight Diagnostics
    runs-on: ubuntu-24.04
    needs: test-chezcord

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Diagnostics Check
        env:
          ARC_SETUP_KEY: ci-preflight-only
          SESSION_SECRET: ci-preflight-session-secret
          ARC_BOT_TOKEN_ENCRYPTION_KEY: ci-preflight-token-encryption-key
          ARC_ENV_FILE: ${{ runner.temp }}/arc-studio-ci.env
          ARC_DATA_DIR: ${{ runner.temp }}/arc-studio-ci-data
        run: node -e "import('./packages/studio-server/src/engine/StartupDiagnostics.js').then(m => { const r = m.StartupDiagnostics.run(); console.log(r); if (!r.healthy) process.exit(1); })"
